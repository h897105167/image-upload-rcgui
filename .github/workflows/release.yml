name: release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="$(node -p "require('./manifest.json').version")"
          echo "tag=$tag manifest=$ver"
          test "$tag" = "$ver" || { echo "tag $tag != manifest version $ver"; exit 1; }

      - run: npm run typecheck
      - run: npm run build

      - name: Package
        run: |
          ver="$(node -p "require('./manifest.json').version")"
          mkdir -p dist
          cp main.js manifest.json dist/
          (cd dist && zip -q "image-upload-rcgui-${ver}.zip" main.js manifest.json)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            dist/image-upload-rcgui-*.zip
          generate_release_notes: true
